<g class="ln" style="animation-delay:1.40s" transform="translate(0,196)"><text x="34" class="m" fill="#59636e">WHERE</text><text x="160" class="m" fill="#59636e">STACK</text><text x="344" class="m" fill="#59636e">ROLE</text><text x="612" class="m" fill="#59636e">STATUS</text></g>
