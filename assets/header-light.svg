<svg xmlns="http://www.w3.org/2000/svg" width="900" height="392" viewBox="0 0 900 392" role="img" aria-label="Jimin Kim — Backend Engineer, owning Infra">
<style>
.m{font:14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;}
.s{font:15px -apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',Helvetica,Arial,sans-serif;}
.b{font-weight:600;font-size:17px}
.n{font-weight:400;font-size:15px}
.ln{opacity:0;animation:in .35s ease-out forwards}
@keyframes in{to{opacity:1}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ln{opacity:1;animation:none}.cur{animation:none}}
</style>
<rect x="1" y="1" width="898" height="390" rx="12" fill="#ffffff" stroke="#d0d7de"/>
